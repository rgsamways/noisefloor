services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: noisefloor_dev
    ports:
      - "5439:5432"
    volumes:
      - noisefloor_postgres_data:/var/lib/postgresql/data

volumes:
  noisefloor_postgres_data:
