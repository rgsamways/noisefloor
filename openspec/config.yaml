schema: spec-driven

context: |
  noisefloor.ca — training for fixed-wireless ISP support technicians.

  CURRENT (phase one, since 2026-09-21): a single vendor-neutral radio
  console (normalized schema + simulation engine + UI), not case-based
  training. Source of truth: docs/NOISEFLOOR-CONSOLE-HANDOFF.md at repo
  root. Read it before proposing any change.

  PARKED: the case-study product (NOISEFLOOR-OUTLINE.md, PROJECT-PLAN.md,
  NOISEFLOOR-AUTHORING-PLAN.md, NOISEFLOOR-INTEGRATION-PLAN.md, and the
  openspec specs marked "Status: Parked") is real, working, tested code —
  not deleted, not the active line of work. Do not propose changes against
  it unless the user explicitly asks to resume that line of work.

  Stack (mirrors the `kerfy` project's conventions exactly): pnpm workspaces,
  TypeScript throughout, strict mode. apps/web: React 19, React Router 8,
  Vite 8, Tailwind v4. apps/api: Fastify 5, Drizzle ORM + pg, Better Auth
  (magic-link plugin), Zod. packages/shared: Zod schemas + pure generator
  functions, no React/DB. packages/dashboards: the React component library
  (crm/radio/nms/device families). packages/cases: case content, validated
  against packages/shared schemas at build time.

  Conventions: conventional commits; ESLint flat config + typescript-eslint;
  Vitest for unit tests, Playwright for e2e + visual snapshots; continuous
  commit-and-push, no long-lived feature branches.

  Standing rules that apply to every change, not just the one being proposed:
  no real customer/employer/vendor data anywhere (synthetic-only, see
  NOISEFLOOR-OUTLINE.md §12); vendor names generic in UI copy, precise only in
  gotcha/KB content; cases and gotchas are authored from Robin's real support
  experience, KB content is Claude-drafted and Robin-reviewed.

